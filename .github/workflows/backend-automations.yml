name: Sitora backend automations

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "43 2 * * *"
    - cron: "7 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-email:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    concurrency:
      group: sitora-cold-email-backend
      cancel-in-progress: false
    steps:
      - name: Voer de enige cold-emailtaak uit
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 2 --retry-all-errors
          --header "Authorization: Bearer ${{ secrets.SITORA_CRON_SECRET }}"
          https://leadfindersitora.nl/api/cron/outreach

  reverify:
    if: github.event.schedule == '43 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Hercontroleer opgeslagen leads
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 2 --retry-all-errors
          --header "Authorization: Bearer ${{ secrets.SITORA_CRON_SECRET }}"
          https://leadfindersitora.nl/api/cron/reverify

  analyze:
    if: github.event.schedule == '7 3 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Werk websiteanalyses bij
        run: >-
          curl --fail-with-body --silent --show-error
          --retry 2 --retry-all-errors
          --header "Authorization: Bearer ${{ secrets.SITORA_CRON_SECRET }}"
          https://leadfindersitora.nl/api/cron/analyze
